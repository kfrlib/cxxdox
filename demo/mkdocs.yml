site_name: CxxDox Demo
theme:
  font: false
  name: "material"
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - navigation.indexes
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  search:
    language: en

copyright: "Copyright &copy; 2026 KFR"

plugins:
  - search
  - privacy
  - cxxdox:
      title: Demo library Reference
      path_prefix: auto/
      default_namespace: ns
      render_snippet_markers: true
      git_browse: https://github.com/kfrlib/cxxdox/blob/{SHA}/demo/{FILE_PATH}#L{LINE}
      input:
        - include:
          - library.hpp # relative to mkdocs.yml
          exclude: []
          exclude_symbols: 
            - '*excluded_function()*'
          hide_tokens:
            - ALWAYS_INLINE
          compile_options:
            - -std=c++20
            - -DMACRO=1
          inline_namespaces:
            - ns::inline_ns
      groups:
        - id: "demo"
          title: "Demo Library"
          description: "This is a demo library for CxxDox."
          file:
            - library.hpp
        - id: "header"
          title: "Separate header"
          file:
            - header.hpp

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - js/math.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css
  - css/theme.css

repo_url: https://github.com/kfrlib/cxxdox
repo_name: CxxDox

validation:
  links:
    absolute_links: relative_to_docs

nav:
  - Home: index.md
  - Library Reference:
    - Demo Library: auto/index.md
