name: Build wheels

# Builds platform-specific wheels for mkdocs-cxxdox.
#
# Each wheel bundles the matching libclang binary, which is extracted from the
# official LLVM release archive on GitHub
# (https://github.com/llvm/llvm-project/releases). The libclang version is
# controlled by the LLVM_VERSION env var below — change it in one place to bump
# the bundled binary for every platform.
#
# Wheels are uploaded as build artifacts and, on tagged releases, attached to
# the GitHub Release so users can install with:
#   pip install <wheel-url-from-release>

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required to attach wheels to a GitHub Release

# === Bump the bundled libclang version by changing only this line. ===
# This is the single source of truth; the prepare job below substitutes it
# into every platform's archive asset name and in-archive path.
env:
  LLVM_VERSION: '21.1.6'

jobs:
  # ---------------------------------------------------------------------------
  # Fetch the clang resource directory (builtin headers: stddef.h, immintrin.h,
  # arm_neon.h, etc.) from the OFFICIAL Linux x64 LLVM release archive once and
  # upload it as a shared artifact reused by all three platform wheel builds.
  #
  # The resource dir is target-independent: one copy serves Windows, Linux and
  # macOS wheels.  We extract from the Linux release because that archive
  # ships the full lib/clang/<major>/include tree including generated headers
  # (arm_neon.h, riscv_vector.h, …) that are absent from the source tarball.
  #
  # Layout inside the wheel:
  #   cxxdox_plugin/libclang21/clang/<major>/include/
  #
  # This is the layout clang's implicit resource-dir discovery expects:
  #   GetResourcesPath(libclang_path) =
  #       parent(parent(libclang_path)) / lib / clang / <MAJOR>
  # where parent(libclang_path) = cxxdox_plugin/libclang21
  #       parent(parent(...))    = cxxdox_plugin
  # → implicit path = cxxdox_plugin / lib / clang / 21
  #
  # We also pass -resource-dir explicitly in parser.py so implicit discovery
  # is belt-and-braces only.
  fetch-resource-dir:
    name: Fetch clang resource directory
    runs-on: ubuntu-latest
    outputs:
      # Major version component (e.g. "21") used by later steps.
      clang_major: ${{ steps.extract.outputs.clang_major }}
    steps:
      - name: Download Linux LLVM archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          echo "Downloading $url"
          curl -fL --retry 3 -o llvm.tar.xz "$url"
          ls -lh llvm.tar.xz

      - name: Extract resource headers
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          # Derive the major version (e.g. "21.1.6" → "21")
          major="${LLVM_VERSION%%.*}"
          echo "clang_major=${major}" >> "$GITHUB_OUTPUT"

          # The Linux LLVM release contains lib/clang/<major>/include/
          prefix="LLVM-${LLVM_VERSION}-Linux-X64/lib/clang/${major}/include"
          echo "Extracting ${prefix}/ from archive …"
          mkdir -p resource-dir/clang/${major}
          # Strip the leading archive-root prefix so we get just include/…
          tar -xJf llvm.tar.xz \
              --strip-components=5 \
              -C resource-dir/clang/${major} \
              "${prefix}"
          echo "Extracted $(find resource-dir -type f | wc -l) files"
          du -sh resource-dir/

      - name: Upload resource-dir artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-resource-dir
          # Upload the whole resource-dir/ tree; the wheel build steps
          # will download it and place it at the right location.
          path: resource-dir/
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: python
        run: |
          import json, os
          v = os.environ["LLVM_VERSION"]
          # Each entry maps a runner to the official LLVM archive asset name
          # and the path of libclang inside that archive. The version is
          # substituted here (env context is NOT available in strategy.matrix,
          # so we bake it in at this step).
          entries = [
              {
                  "os": "windows-latest",
                  "arch": "x64",
                  "wheel_tag": "win_amd64",
                  "llvm_asset": f"clang+llvm-{v}-x86_64-pc-windows-msvc.tar.xz",
                  "libclang_in_archive": f"clang+llvm-{v}-x86_64-pc-windows-msvc/bin/libclang.dll",
                  "staged_name": "libclang.dll",
              },
              {
                  "os": "ubuntu-latest",
                  "arch": "x64",
                  # NOTE: must be a PEP 600 tag with a glibc version —
                  # bare `manylinux_x86_64` is NOT recognized by pip and
                  # wheels tagged with it fail to install. manylinux_2_17
                  # (glibc 2.17 / CentOS 7) is the most broadly compatible.
                  "wheel_tag": "manylinux_2_17_x86_64",
                  "llvm_asset": f"LLVM-{v}-Linux-X64.tar.xz",
                  # Linux release ships a versioned soname, e.g. libclang.so.21.1.6
                  "libclang_in_archive": f"LLVM-{v}-Linux-X64/lib/libclang.so.{v}",
                  "staged_name": "libclang.so",
              },
              # Additional OS/archs can be added here (e.g. ubuntu-arm, macos-latest).
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": entries}) + "\n")

  build:
    name: Build wheel (${{ matrix.os }} / ${{ matrix.arch }})
    needs: [prepare, fetch-resource-dir]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools twine

      - name: Download official LLVM archive
        # Download the prebuilt LLVM archive for this platform from the
        # llvm/llvm-project GitHub release tagged llvmorg-<version>.
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.llvm_asset }}"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fL --retry 3 -o llvm.tar.xz "$url"
          ls -la llvm.tar.xz

      - name: Extract libclang from archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llvm-extract
          tar -xJf llvm.tar.xz --wildcards -C llvm-extract "*/${{ matrix.staged_name }}*"
          found="$(find llvm-extract -type f -name '${{ matrix.staged_name }}*' | head -n1)"
          test -n "$found" || { echo "libclang not found after extraction"; exit 1; }
          echo "libclang_path=$found" >> "$GITHUB_ENV"

      - name: Stage libclang binary into package
        shell: bash
        run: |
          set -euo pipefail
          dest="cxxdox_plugin/libclang21"
          mkdir -p "$dest"
          cp "$libclang_path" "$dest/${{ matrix.staged_name }}"
          ls -la "$dest"

      - name: Download clang resource-dir artifact
        uses: actions/download-artifact@v4
        with:
          name: clang-resource-dir
          # Download into a staging area so we can place it at the correct path.
          path: clang-resource-dir-staging

      - name: Stage resource directory into package
        # Place the resource headers where both implicit AND explicit discovery
        # will find them.
        #
        # Implicit discovery path (derived from GetResourcesPath in CIndexer.cpp):
        #   GetResourcesPath strips the filename from libclang.so, giving
        #   cxxdox_plugin/libclang21/, then calls Driver::GetResourcesPath which
        #   does:  parent(dir) / CLANG_INSTALL_LIBDIR_BASENAME / "clang" / MAJOR
        #       =  cxxdox_plugin / lib / clang / <major>
        #
        # So for implicit discovery we need:
        #   cxxdox_plugin/lib/clang/<major>/include/
        #
        # For the explicit -resource-dir we pass in parser.py we use:
        #   cxxdox_plugin/libclang21/clang/<major>
        # which is a self-contained layout inside the libclang21 directory.
        # We maintain BOTH so either approach works.
        shell: bash
        run: |
          set -euo pipefail
          major="${LLVM_VERSION%%.*}"

          # Belt: explicit -resource-dir target (inside libclang21/)
          dest_explicit="cxxdox_plugin/libclang21/clang/${major}"
          mkdir -p "${dest_explicit}"
          cp -r clang-resource-dir-staging/clang/${major}/include "${dest_explicit}/"

          # Braces: implicit discovery target (sibling lib/clang/ next to libclang21/)
          dest_implicit="cxxdox_plugin/lib/clang/${major}"
          mkdir -p "${dest_implicit}"
          cp -r clang-resource-dir-staging/clang/${major}/include "${dest_implicit}/"

          echo "Resource header count: $(find cxxdox_plugin/libclang21/clang -type f | wc -l)"
          du -sh cxxdox_plugin/libclang21/clang/ cxxdox_plugin/lib/

      - name: Build wheel
        run: |
          python -m pip wheel . --no-deps -w wheelhouse/

      # The package is pure-Python, so setuptools tags every wheel as
      # `py3-none-any`. But each wheel bundles a platform-specific libclang
      # binary, so it must carry a real platform tag — otherwise the Windows
      # and Linux wheels end up with identical filenames and clobber each
      # other when artifacts are merged for the release.
      - name: Retag wheel with platform tag
        shell: bash
        run: |
          # --platform-tag replaces the wheel's platform tag set, so the
          # default `any` is dropped automatically (no need for --remove).
          # `wheel tags` writes a new file but leaves the original on disk,
          # so we must delete the `any` wheel ourselves — otherwise the
          # upload-artifact glob below picks up both, and the mis-tagged
          # `any` wheel would still collide across platforms in the release.
          python -m wheel tags \
            --platform-tag '${{ matrix.wheel_tag }}' \
            wheelhouse/*.whl
          rm -f wheelhouse/*-any.whl
          ls -la wheelhouse/

      - name: Check wheel metadata
        run: |
          python -m twine check wheelhouse/*.whl

      - name: List built wheels
        shell: bash
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do echo "  $w"; done

      # Smoke-test the wheel before uploading it. This catches packaging bugs
      # early
      - name: Test-install wheel
        shell: bash
        run: |
          set -euo pipefail
          # Install the wheel WITH deps (mkdocs, parsimonious, ...) to make
          # sure install_requires resolves and the plugin loads.
          python -m pip install wheelhouse/*.whl
          python "${GITHUB_WORKSPACE}/.github/workflows/smoke_test.py"

      - name: Assert resource headers are in the wheel
        # Unzip the wheel (which is a zip archive) and verify the bundled
        # clang resource directory contains stddef.h.  This test operates
        # on the BUILT wheel file, not on the source tree, so it catches
        # packaging glitches (missing globs, wrong include_package_data, etc.)
        # that would allow the wheel to ship broken.
        shell: bash
        run: |
          set -euo pipefail
          major="${LLVM_VERSION%%.*}"
          whl="$(ls wheelhouse/*.whl | head -n1)"
          echo "Inspecting wheel: $whl"

          # Wheels are zip files; list contents and search for stddef.h
          found=$(python -c "
          import zipfile, sys
          whl = sys.argv[1]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          hits = [n for n in names if n.endswith('stddef.h')]
          if not hits:
              print('MISSING')
          else:
              print('\n'.join(hits))
          " "$whl")
          echo "stddef.h entries in wheel: $found"
          if [ "$found" = "MISSING" ]; then
            echo "ERROR: stddef.h not found inside the wheel — resource headers were not packaged!"
            exit 1
          fi

          # Also verify immintrin.h (x86 SIMD) is present
          found_imm=$(python -c "
          import zipfile, sys
          whl = sys.argv[1]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          hits = [n for n in names if n.endswith('immintrin.h')]
          print('MISSING' if not hits else hits[0])
          " "$whl")
          echo "immintrin.h in wheel: $found_imm"
          if [ "$found_imm" = "MISSING" ]; then
            echo "ERROR: immintrin.h not found — x86 SIMD headers are missing from the wheel!"
            exit 1
          fi
          echo "OK: resource headers are present in the wheel."

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach wheels to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -la wheels/

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true

  pages:
    name: Build & publish demo to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Build the demo site from the main branch and from tagged releases.
    # Pages deployment requires the repo to have Pages enabled with the
    # "GitHub Actions" source in Settings → Pages.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    # Pushing a tag that sits on main triggers two workflow runs at once
    # (one for the branch push, one for the tag push). Both would deploy to
    # the same Pages environment and race. This concurrency group ensures
    # only one Pages deployment runs at a time; the later-triggered run
    # cancels the earlier one. Content is identical because the tag points
    # at the same commit as main, so it doesn't matter which wins.
    concurrency:
      group: pages
      cancel-in-progress: true

    permissions:
      pages: write        # required to deploy to Pages
      id-token: write     # required to use the Pages deployment action
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      - name: Download built wheel (Linux x64)
        uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux_2_17_x86_64
          path: wheelhouse

      - name: Install plugin from wheel + demo deps
        run: |
          # Install the freshly built wheel (bundles libclang.so for Linux).
          pip install wheelhouse/mkdocs_cxxdox-*.whl
          # Material theme + extras used by demo/mkdocs.yml.
          pip install 'mkdocs-material>=9.1.15'

      - name: Build demo site
        working-directory: demo
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
